# The surefold, pelican and bank packages every module builds against: surefold's 0.14.0 and pelican's 1.2.0
# releases, and a bank snapshot installed with `./gradlew publishToMavenLocal` in its checkout, or all built from
# source with -PsurefoldSource and -PpelicanSource.
surefoldVersion=0.14.0
pelicanVersion=1.2.0
bankVersion=0.1.0-SNAPSHOT
# Room for Kotlin compiling in this daemon: CI passes -Pkotlin.compiler.execution.strategy=in-process, the one
# spelling surefold's and pelican's included builds read too. Each brings its own Kotlin, and their three compile daemons
# left beside the tests ran the runner out of memory. Two workers, so no more than two compilations or test JVMs at once.
org.gradle.jvmargs=-Xmx3g
org.gradle.workers.max=2
org.gradle.parallel=true
org.gradle.caching=true
