# The lark, pelican and bank packages every module builds against: snapshots installed with
# `./gradlew publishToMavenLocal` in each checkout, or built from source with -PlarkSource and -PpelicanSource.
larkVersion=0.10.2-SNAPSHOT
pelicanVersion=1.0.1-SNAPSHOT
bankVersion=0.1.0-SNAPSHOT
# Kotlin compiles inside this daemon, for lark's and pelican's builds too: each brings its own Kotlin, and three
# compile daemons beside it and the tests ran CI's runner out of memory.
org.gradle.jvmargs=-Xmx3g -Dkotlin.compiler.execution.strategy=in-process
org.gradle.parallel=true
org.gradle.caching=true
