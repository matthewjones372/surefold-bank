# The lark, pelican and bank packages every module builds against: snapshots installed with
# `./gradlew publishToMavenLocal` in each checkout, or built from source with -PlarkSource and -PpelicanSource.
larkVersion=0.10.2-SNAPSHOT
pelicanVersion=1.0.1-SNAPSHOT
bankVersion=0.1.0-SNAPSHOT
# Each compilation in a process of its own that ends with it, for lark's and pelican's builds too (a system property
# reaches the included builds): each brings its own Kotlin, and three compile daemons left beside the tests ran CI's
# runner out of memory. Two workers, so no more than two compilations or test JVMs at once.
org.gradle.jvmargs=-Xmx2g -Dkotlin.compiler.execution.strategy=out-of-process
org.gradle.workers.max=2
org.gradle.parallel=true
org.gradle.caching=true
