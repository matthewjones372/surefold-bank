name: build

# Each service built and tested on GitHub's runners, never a self-hosted one. Lark and Pelican come from their public
# repositories at the revisions lark-bank/flake.lock pins, verdict from its main, and the bank's events (and its test
# issuer) are published to Maven local before the services that read them are built.
on:
  push: { branches: [ main ] }
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which services a pull request needs built: the ones it changes, and the ones that build from what it changes
  # (lark-bank's events, issuer and pins; bank-access's client). A push to main builds them all.
  changes:
    runs-on: ubuntu-latest
    outputs:
      lark-bank: ${{ steps.which.outputs.lark-bank }}
      bank-checks: ${{ steps.which.outputs.bank-checks }}
      bank-approvals: ${{ steps.which.outputs.bank-approvals }}
      bank-access: ${{ steps.which.outputs.bank-access }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - id: which
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          all() { for s in lark-bank bank-checks bank-approvals bank-access; do echo "$s=true" >> "$GITHUB_OUTPUT"; done; }
          if [ "${{ github.event_name }}" != "pull_request" ]; then all; exit 0; fi
          # Markdown (specs, docs, READMEs) builds nothing.
          changed=$(git diff --name-only "$BASE...$HEAD" | grep -vE '\.md$' || true)
          echo "$changed"
          touches() { echo "$changed" | grep -qE "$1" && echo true || echo false; }
          shared='^(\.github/workflows/build\.yml|lark-bank/(events/|issuer/|flake\.lock))'
          echo "lark-bank=$(touches '^(lark-bank/|bank-access/|\.github/workflows/build\.yml)')" >> "$GITHUB_OUTPUT"
          echo "bank-checks=$(touches "^bank-checks/|$shared")" >> "$GITHUB_OUTPUT"
          echo "bank-approvals=$(touches "^bank-approvals/|$shared")" >> "$GITHUB_OUTPUT"
          echo "bank-access=$(touches "^bank-access/|$shared")" >> "$GITHUB_OUTPUT"

  lark-bank:
    needs: changes
    if: needs.changes.outputs.lark-bank == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      # Gradle's downloads (plugins, dependencies, the distribution) kept between runs, so a repository's hiccup
      # doesn't fail the job and a warm job skips the downloads.
      # On main, what this build resolved is written as a dependency graph for the dependency-graph job to submit
      # (GitHub can't read build.gradle.kts itself). Generating needs no write token, so this job, which runs the
      # change's own build, keeps a read-only one.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: "${{ github.ref != 'refs/heads/main' }}"
          dependency-graph: "${{ github.event_name == 'push' && 'generate' || 'disabled' }}"
      - id: pins
        run: |
          pin() { nix eval --impure --raw --expr "(builtins.fromJSON (builtins.readFile ./lark-bank/flake.lock)).nodes.$1.locked.rev"; }
          echo "lark=$(pin lark)" >> "$GITHUB_OUTPUT"
          echo "pelican=$(pin pelican)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with: { repository: matthewjones372/lark, ref: "${{ steps.pins.outputs.lark }}", path: deps/lark }
      - uses: actions/checkout@v5
        with: { repository: matthewjones372/pelican, ref: "${{ steps.pins.outputs.pelican }}", path: deps/pelican }
      - name: Build and test
        working-directory: lark-bank
        run: |
          nix develop .#ci -c ./gradlew -PlarkSource=../deps/lark -PpelicanSource=../deps/pelican -PaccessSource=../bank-access \
            -Porg.gradle.java.installations.fromEnv=JDK25,JDK21 -Porg.gradle.java.installations.auto-download=false \
            build :events:build --stacktrace koverXmlReport
      - name: Keep the test and coverage reports for Gauntlet
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/gauntlet-reports"
          find . \( -path '*/build/test-results/*.xml' -o -path '*/build/reports/kover/*.xml' -o -path '*/build/reports/jacoco/*.xml' -o -path '*/test-reports/*.xml' -o -path '*/coverage-report/cobertura.xml' \) -not -path './.git/*' | while read -r f; do mkdir -p "$RUNNER_TEMP/gauntlet-reports/$(dirname "$f")"; cp "$f" "$RUNNER_TEMP/gauntlet-reports/$f"; done
      - name: Upload the reports for Gauntlet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-reports-lark-bank
          path: ${{ runner.temp }}/gauntlet-reports
          if-no-files-found: ignore
          retention-days: 7
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lark-bank-test-reports
          path: |
            lark-bank/**/build/reports/tests/
            lark-bank/**/build/test-results/
          retention-days: 7

  bank-checks:
    needs: changes
    if: needs.changes.outputs.bank-checks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      # Gradle's downloads (plugins, dependencies, the distribution) kept between runs, so a repository's hiccup
      # doesn't fail the job and a warm job skips the downloads.
      - uses: gradle/actions/setup-gradle@v4
        with: { cache-read-only: "${{ github.ref != 'refs/heads/main' }}" }
      # sbt's and Coursier's downloads kept between runs, for the same reasons.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
            ~/.sbt
          key: sbt-${{ runner.os }}-${{ hashFiles('bank-checks/**/*.sbt', 'bank-checks/project/build.properties') }}
          restore-keys: sbt-${{ runner.os }}-
      - uses: actions/checkout@v5
        with: { repository: matthewjones372/verdict, path: deps/verdict }
      - id: pins
        run: |
          pin() { nix eval --impure --raw --expr "(builtins.fromJSON (builtins.readFile ./lark-bank/flake.lock)).nodes.$1.locked.rev"; }
          echo "lark=$(pin lark)" >> "$GITHUB_OUTPUT"
          echo "pelican=$(pin pelican)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with: { repository: matthewjones372/lark, ref: "${{ steps.pins.outputs.lark }}", path: deps/lark }
      - uses: actions/checkout@v5
        with: { repository: matthewjones372/pelican, ref: "${{ steps.pins.outputs.pelican }}", path: deps/pelican }
      - name: verdict, lark-bank-events and lark-bank-issuer, published locally
        run: |
          (cd bank-checks && nix develop -c bash -c 'cd ../deps/verdict && sbt -batch publishLocal')
          (cd lark-bank && nix develop .#ci -c ./gradlew -PlarkSource=../deps/lark -PpelicanSource=../deps/pelican \
            :events:publishToMavenLocal :issuer:publishToMavenLocal)
      - name: Build and test
        working-directory: bank-checks
        run: nix develop -c sbt -batch compile coverage test coverageReport scalafmtCheckAll
      - name: Keep the test and coverage reports for Gauntlet
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/gauntlet-reports"
          find . \( -path '*/build/test-results/*.xml' -o -path '*/build/reports/kover/*.xml' -o -path '*/build/reports/jacoco/*.xml' -o -path '*/test-reports/*.xml' -o -path '*/coverage-report/cobertura.xml' \) -not -path './.git/*' | while read -r f; do mkdir -p "$RUNNER_TEMP/gauntlet-reports/$(dirname "$f")"; cp "$f" "$RUNNER_TEMP/gauntlet-reports/$f"; done
      - name: Upload the reports for Gauntlet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-reports-bank-checks
          path: ${{ runner.temp }}/gauntlet-reports
          if-no-files-found: ignore
          retention-days: 7

  bank-approvals:
    needs: changes
    if: needs.changes.outputs.bank-approvals == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      # Gradle's downloads (plugins, dependencies, the distribution) kept between runs, so a repository's hiccup
      # doesn't fail the job and a warm job skips the downloads.
      # On main, what this build resolved is written as a dependency graph for the dependency-graph job to submit
      # (GitHub can't read build.gradle.kts itself). Generating needs no write token, so this job, which runs the
      # change's own build, keeps a read-only one.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: "${{ github.ref != 'refs/heads/main' }}"
          dependency-graph: "${{ github.event_name == 'push' && 'generate' || 'disabled' }}"
      - id: pins
        run: |
          pin() { nix eval --impure --raw --expr "(builtins.fromJSON (builtins.readFile ./lark-bank/flake.lock)).nodes.$1.locked.rev"; }
          echo "lark=$(pin lark)" >> "$GITHUB_OUTPUT"
          echo "pelican=$(pin pelican)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with: { repository: matthewjones372/lark, ref: "${{ steps.pins.outputs.lark }}", path: deps/lark }
      - uses: actions/checkout@v5
        with: { repository: matthewjones372/pelican, ref: "${{ steps.pins.outputs.pelican }}", path: deps/pelican }
      - name: lark-bank-events and lark-bank-issuer, published locally
        working-directory: lark-bank
        run: |
          nix develop .#ci -c ./gradlew -PlarkSource=../deps/lark -PpelicanSource=../deps/pelican \
            :events:publishToMavenLocal :issuer:publishToMavenLocal
      - name: Build and test
        working-directory: bank-approvals
        run: nix develop .#ci -c ./gradlew -PlarkSource=../deps/lark -PpelicanSource=../deps/pelican build --stacktrace koverXmlReport
      - name: Keep the test and coverage reports for Gauntlet
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/gauntlet-reports"
          find . \( -path '*/build/test-results/*.xml' -o -path '*/build/reports/kover/*.xml' -o -path '*/build/reports/jacoco/*.xml' -o -path '*/test-reports/*.xml' -o -path '*/coverage-report/cobertura.xml' \) -not -path './.git/*' | while read -r f; do mkdir -p "$RUNNER_TEMP/gauntlet-reports/$(dirname "$f")"; cp "$f" "$RUNNER_TEMP/gauntlet-reports/$f"; done
      - name: Upload the reports for Gauntlet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-reports-bank-approvals
          path: ${{ runner.temp }}/gauntlet-reports
          if-no-files-found: ignore
          retention-days: 7
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bank-approvals-test-reports
          path: |
            bank-approvals/**/build/reports/tests/
            bank-approvals/**/build/test-results/
          retention-days: 7

  bank-access:
    needs: changes
    if: needs.changes.outputs.bank-access == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      # Gradle's downloads (plugins, dependencies, the distribution) kept between runs, so a repository's hiccup
      # doesn't fail the job and a warm job skips the downloads.
      # On main, what this build resolved is written as a dependency graph for the dependency-graph job to submit
      # (GitHub can't read build.gradle.kts itself). Generating needs no write token, so this job, which runs the
      # change's own build, keeps a read-only one.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: "${{ github.ref != 'refs/heads/main' }}"
          dependency-graph: "${{ github.event_name == 'push' && 'generate' || 'disabled' }}"
      - name: The model's tests
        working-directory: bank-access
        run: nix flake check --print-build-logs
      - id: pins
        run: |
          pin() { nix eval --impure --raw --expr "(builtins.fromJSON (builtins.readFile ./lark-bank/flake.lock)).nodes.$1.locked.rev"; }
          echo "lark=$(pin lark)" >> "$GITHUB_OUTPUT"
          echo "pelican=$(pin pelican)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with: { repository: matthewjones372/lark, ref: "${{ steps.pins.outputs.lark }}", path: deps/lark }
      - uses: actions/checkout@v5
        with: { repository: matthewjones372/pelican, ref: "${{ steps.pins.outputs.pelican }}", path: deps/pelican }
      - name: lark-bank-events, published locally
        working-directory: lark-bank
        run: nix develop .#ci -c ./gradlew -PlarkSource=../deps/lark -PpelicanSource=../deps/pelican :events:publishToMavenLocal
      - name: Build and test access-sync and the client
        working-directory: bank-access
        run: nix develop -c ./gradlew build koverXmlReport
      - name: Keep the test and coverage reports for Gauntlet
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/gauntlet-reports"
          find . \( -path '*/build/test-results/*.xml' -o -path '*/build/reports/kover/*.xml' -o -path '*/build/reports/jacoco/*.xml' -o -path '*/test-reports/*.xml' -o -path '*/coverage-report/cobertura.xml' \) -not -path './.git/*' | while read -r f; do mkdir -p "$RUNNER_TEMP/gauntlet-reports/$(dirname "$f")"; cp "$f" "$RUNNER_TEMP/gauntlet-reports/$f"; done
      - name: Upload the reports for Gauntlet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-reports-bank-access
          path: ${{ runner.temp }}/gauntlet-reports
          if-no-files-found: ignore
          retention-days: 7

  # Submits the dependency graphs the builds wrote, so Dependabot alerts cover the Gradle builds. Only on a push to
  # main, and it runs none of the repository's code: it downloads the graph files and submits them, so the write token
  # it needs never reaches a build.
  dependency-graph:
    needs: [lark-bank, bank-approvals, bank-access]
    if: github.event_name == 'push' && !cancelled()
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: gradle/actions/dependency-submission@v4
        with: { dependency-graph: download-and-submit }
