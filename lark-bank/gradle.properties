# The lark every module builds against: a snapshot of lark's main, installed with
# `./gradlew publishToMavenLocal` in a lark checkout. `scripts/lark-snapshot.sh` does that.
larkVersion=0.10.2-SNAPSHOT
pelicanVersion=1.0.1-SNAPSHOT
proofloadVersion=0.1.0-rc4
# Room for Kotlin compiling in this daemon: CI passes -Pkotlin.compiler.execution.strategy=in-process, the one
# spelling lark's and pelican's included builds read too. Each brings its own Kotlin, and their three compile daemons
# left beside the tests ran the runner out of memory. Two workers, so no more than two compilations or test JVMs at once.
org.gradle.jvmargs=-Xmx3g
org.gradle.workers.max=2
org.gradle.parallel=true
org.gradle.caching=true
