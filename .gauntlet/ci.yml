# How Gauntlet's GitHub check builds this project, drafted from its own CI workflows by
# `gauntlet connect github`. `setup` runs before the checks; `builds` says how each build
# runs its tool there. Locally Gauntlet builds as usual. It's protected: an owner changes it,
# then runs `gauntlet connect github` again.
setup: 
  - uses: cachix/install-nix-action@v31
  - id: pins
    run: "pin() { nix eval --impure --raw --expr \"(builtins.fromJSON (builtins.readFile ./bank/flake.lock)).nodes.$1.locked.rev\"; }\necho \"surefold=$(pin surefold)\" >> \"$GITHUB_OUTPUT\"\necho \"pelican=$(pin pelican)\" >> \"$GITHUB_OUTPUT\"\n"
  - uses: actions/checkout@v5
    with: 
      repository: matthewjones372/surefold
      ref: "${{ steps.pins.outputs.surefold }}"
      path: deps/surefold
  - uses: actions/checkout@v5
    with: 
      repository: matthewjones372/pelican
      ref: "${{ steps.pins.outputs.pelican }}"
      path: deps/pelican
  - uses: actions/checkout@v5
    with: 
      repository: matthewjones372/verdict
      path: deps/verdict
  - name: "verdict, surefold-bank-events and surefold-bank-issuer, published locally"
    run: "(cd bank-checks && nix develop -c bash -c 'cd ../deps/verdict && sbt -batch publishLocal')\n(cd bank && nix develop .#ci -c ./gradlew -PsurefoldSource=../deps/surefold -PpelicanSource=../deps/pelican \\\n  :events:publishToMavenLocal :issuer:publishToMavenLocal)\n"
  - name: "surefold-bank-events and surefold-bank-issuer, published locally"
    working-directory: bank
    run: "nix develop .#ci -c ./gradlew -PsurefoldSource=../deps/surefold -PpelicanSource=../deps/pelican \\\n  :events:publishToMavenLocal :issuer:publishToMavenLocal\n"
  - name: "surefold-bank-events, published locally"
    working-directory: bank
    run: "nix develop .#ci -c ./gradlew -PsurefoldSource=../deps/surefold -PpelicanSource=../deps/pelican :events:publishToMavenLocal"
builds: 
  bank: 
    wrap: "nix develop .#ci -c"
    tool: "./gradlew -PsurefoldSource=$GITHUB_WORKSPACE/deps/surefold -PpelicanSource=$GITHUB_WORKSPACE/deps/pelican -PaccessSource=$GITHUB_WORKSPACE/bank-access -Porg.gradle.java.installations.fromEnv=JDK25,JDK21 -Porg.gradle.java.installations.auto-download=false -Pkotlin.compiler.execution.strategy=in-process"
  bank-checks:
    wrap: nix develop -c
  bank-approvals: 
    wrap: "nix develop .#ci -c"
    tool: "./gradlew -PsurefoldSource=$GITHUB_WORKSPACE/deps/surefold -PpelicanSource=$GITHUB_WORKSPACE/deps/pelican -Pkotlin.compiler.execution.strategy=in-process"
  bank-access: 
    wrap: nix develop -c
