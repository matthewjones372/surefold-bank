# Surefold from Maven Central, the release rather than a snapshot: core 0.18.1 (dev.surefold), which is where
# the durable saga lives, and the integration modules (Kafka, config, Liquibase, observability, kotlinx) at their
# 0.18.0 release. Pelican stays 1.2.0. A checkout with -PsurefoldSource replaces the core when it publishes dev.surefold.
surefoldVersion=0.18.1
surefoldIntegrationsVersion=0.18.0
pelicanVersion=1.2.0
proofloadVersion=0.1.0-rc4
# Room for Kotlin compiling in this daemon: CI passes -Pkotlin.compiler.execution.strategy=in-process, the one
# spelling surefold's and pelican's included builds read too. Each brings its own Kotlin, and their three compile daemons
# left beside the tests ran the runner out of memory. Two workers, so no more than two compilations or test JVMs at once.
org.gradle.jvmargs=-Xmx3g
org.gradle.workers.max=2
org.gradle.parallel=true
org.gradle.caching=true
